<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Project — Destination</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #06080f;
      --panel:     #0d1120;
      --panel2:    #111828;
      --border:    #1e2d50;
      --accent:    #3d8ef0;
      --accent2:   #5eb8ff;
      --glow:      rgba(61,142,240,.35);
      --text:      #c8d8f0;
      --text-dim:  #56718a;
      --label:     #3d8ef0;
      --value:     #e8f2ff;
      --danger:    #f05a3d;
    }

    /* ── BACKGROUND ── */
    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1px 1px at 10% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 60%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 30%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 80%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 20%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 50%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 85%, #fff 0%, transparent 100%),
        radial-gradient(2px 2px at 15% 90%, rgba(100,180,255,.5) 0%, transparent 100%),
        radial-gradient(2px 2px at 78% 8%, rgba(100,180,255,.4) 0%, transparent 100%);
    }

    /* ── LAYOUT ── */
    .page-wrap {
      position: relative; z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(1.2rem, 4vw, 2.5rem) clamp(1rem, 4vw, 2rem) 3rem;
    }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; gap: .75rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    .logo-icon {
      width: 36px; height: 36px; flex-shrink: 0;
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--accent2);
      text-shadow: 0 0 18px var(--glow);
    }
    h1 span { color: var(--text-dim); font-weight: 400; font-size: .7em; letter-spacing: .06em; }

    /* ── CARD ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(1.2rem, 4vw, 2rem);
      box-shadow: 0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.04);
    }

    /* ── SECTION LABEL ── */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: .75rem;
    }

    /* ── DROPDOWN ── */
    .select-wrap {
      position: relative; margin-bottom: 2rem;
    }
    .select-wrap select {
      width: 100%;
      appearance: none;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(.9rem, 2.5vw, 1rem);
      font-weight: 500;
      padding: .75rem 3rem .75rem 1.1rem;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .select-wrap select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,142,240,.2);
    }
    .select-arrow {
      position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--accent);
    }
    .select-arrow svg { display: block; }

    /* ── INFO GRID ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: .9rem 1.4rem;
      margin-bottom: 2rem;
    }
    @media (max-width: 420px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    .info-item { display: flex; flex-direction: column; gap: .25rem; }
    .info-label {
      font-size: .65rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--label);
    }
    .info-value {
      font-size: clamp(.9rem, 2.5vw, 1rem);
      font-weight: 500;
      color: var(--value);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .5rem .8rem;
      min-height: 2.4rem;
      transition: color .3s, border-color .3s;
    }
    .info-value.populated {
      border-color: rgba(61,142,240,.4);
      color: var(--value);
    }
    .info-value:not(.populated) { color: var(--text-dim); font-style: italic; font-size: .85rem; }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 30%, var(--border) 70%, transparent);
      margin: 1.5rem 0;
    }

    /* ── IMAGE BLOCK ── */
    .image-section { margin-bottom: 2rem; }
    .destination-image-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel2);
    }
    .destination-image-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
      transition: opacity .5s ease, transform .6s ease;
      opacity: 0;
    }
    .destination-image-wrap img.visible { opacity: 1; transform: scale(1.02); }
    .img-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .5rem; color: var(--text-dim);
    }
    .img-placeholder svg { opacity: .3; }
    .img-placeholder span { font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; }

    /* corner accents */
    .corner { position: absolute; width: 14px; height: 14px; }
    .corner.tl { top: 8px; left: 8px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner.tr { top: 8px; right: 8px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
    .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
    .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

    /* ── TEXTAREA ── */
    .comments-section {}
    textarea {
      width: 100%;
      min-height: clamp(100px, 20vw, 140px);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Exo 2', sans-serif;
      font-size: clamp(.85rem, 2.3vw, .95rem);
      font-weight: 300;
      line-height: 1.7;
      padding: .85rem 1rem;
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61,142,240,.15);
    }
    textarea::placeholder { color: var(--text-dim); font-style: italic; }

    /* ── SCAN LINE EFFECT ── */
    .card::after {
      content: '';
      display: block;
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,.07) 3px,
        rgba(0,0,0,.07) 4px
      );
      pointer-events: none;
    }
    .card { position: relative; overflow: hidden; }

    /* ── PULSE ANIMATION for new data ── */
    @keyframes dataPulse {
      0%   { background-color: rgba(61,142,240,.18); }
      100% { background-color: transparent; }
    }
    .info-value.pulse { animation: dataPulse .6s ease-out; }
  </style>
</head>
<body>

<div class="stars"></div>

<div class="page-wrap">

  <header>
    <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="18,2 22,13 34,13 24,21 28,33 18,25 8,33 12,21 2,13 14,13" fill="none" stroke="#3d8ef0" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="18" cy="18" r="4" fill="#3d8ef0" opacity=".6"/>
    </svg>
    <div>
      <h1>STAR PROJECT <span>/ DESTINATION PANEL</span></h1>
    </div>
  </header>

  <div class="card">

    <!-- Dropdown -->
    <p class="section-title">Destination</p>
    <div class="select-wrap">
      <select id="destinationSelect">
        <option value="">— Select a destination —</option>
        <option value="mars">Mars</option>
        <option value="europa">Europa</option>
        <option value="titan">Titan</option>
        <option value="proxima">Proxima Centauri b</option>
        <option value="kepler">Kepler-452b</option>
      </select>
      <span class="select-arrow">
        <svg width="14" height="9" viewBox="0 0 14 9" fill="none">
          <path d="M1 1l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>

    <!-- Info Grid -->
    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Name</span>
        <div class="info-value" id="infoName">—</div>
      </div>
      <div class="info-item">
        <span class="info-label">Distance</span>
        <div class="info-value" id="infoDistance">—</div>
      </div>
      <div class="info-item">
        <span class="info-label">Location</span>
        <div class="info-value" id="infoLocation">—</div>
      </div>
      <div class="info-item">
        <span class="info-label">Arrival Time</span>
        <div class="info-value" id="infoArrival">—</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Image -->
    <div class="image-section">
      <p class="section-title">Destination Image</p>
      <div class="destination-image-wrap" id="imageWrap">
        <div class="img-placeholder" id="imgPlaceholder">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="#3d8ef0" stroke-width="1.5" stroke-dasharray="4 3"/>
            <line x1="24" y1="4" x2="24" y2="44" stroke="#3d8ef0" stroke-width="1" opacity=".4"/>
            <line x1="4" y1="24" x2="44" y2="24" stroke="#3d8ef0" stroke-width="1" opacity=".4"/>
          </svg>
          <span>Awaiting selection</span>
        </div>
        <img id="destImage" src="" alt="Destination" />
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Comments -->
    <div class="comments-section">
      <p class="section-title">Destination Comments</p>
      <textarea id="destComments" placeholder="Select a destination to load mission notes…" readonly></textarea>
    </div>

  </div><!-- /card -->
</div><!-- /page-wrap -->

<script>
  const destinations = {
    mars: {
      name: "Mars",
      distance: "54.6 – 401 million km",
      location: "Inner Solar System",
      arrival: "~7 months (Hohmann)",
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/800px-OSIRIS_Mars_true_color.jpg",
      comments: "Mars, the Red Planet, is the primary near-term colonization target. Its day is 24h 37min — nearly identical to Earth's. Thin CO₂ atmosphere (0.6% of Earth pressure) requires full life-support systems. Olympus Mons, the tallest volcano in the solar system, rises 22 km. Water ice confirmed at both poles. Candidate sites include Hellas Basin and Jezero Crater. Radiation shielding remains the principal engineering challenge for long-duration surface missions."
    },
    europa: {
      name: "Europa",
      distance: "628.3 million km",
      location: "Jovian System — Moon of Jupiter",
      arrival: "~6 years (direct trajectory)",
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Europa-moon-with-margins.jpg/800px-Europa-moon-with-margins.jpg",
      comments: "Europa harbours a global subsurface ocean beneath an icy crust estimated at 10–30 km thick. Tidal flexing from Jupiter's gravitational field generates internal heat — a key driver of potential habitability. Surface temperature averages −160 °C. The ocean floor may host hydrothermal vents analogous to those supporting life on Earth. A dedicated lander mission would drill through the ice to sample the ocean directly. Extreme radiation from Jupiter's magnetosphere demands heavily shielded spacecraft electronics."
    },
    titan: {
      name: "Titan",
      distance: "1.2 billion km",
      location: "Saturnian System — Moon of Saturn",
      arrival: "~7 years (Cassini-class)",
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Titan_in_true_color.jpg/768px-Titan_in_true_color.jpg",
      comments: "Titan is the only moon in the Solar System with a dense atmosphere — 1.5× denser than Earth at sea level — composed primarily of nitrogen with methane clouds. Lakes and rivers of liquid methane and ethane dot the polar regions. Surface pressure (~1.5 bar) means humans would need insulated suits but not pressure suits. Gravity is 1/7th of Earth's. The Dragonfly rotorcraft mission will survey the surface in the 2030s. Prebiotic chemistry analogues may reveal insights into life's origins."
    },
    proxima: {
      name: "Proxima Centauri b",
      distance: "4.24 light-years",
      location: "Alpha Centauri System",
      arrival: "~100 years (Breakthrough Starshot)",
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Artist%27s_impression_of_Proxima_Centauri_b.jpg/800px-Artist%27s_impression_of_Proxima_Centauri_b.jpg",
      comments: "Proxima Centauri b is the closest known exoplanet to Earth, orbiting within the habitable zone of its red dwarf host star. With an orbital period of just 11.2 days, it is likely tidally locked — one hemisphere in permanent day, the other in permanent night. The star is magnetically active, producing frequent UV and X-ray flares that could strip a thin atmosphere over geological timescales. Whether the planet retains liquid water or a magnetosphere remains an open question. The Breakthrough Starshot initiative proposes laser-propelled nanosailcraft to reach the system in roughly a century."
    },
    kepler: {
      name: "Kepler-452b",
      distance: "1,400 light-years",
      location: "Cygnus Constellation",
      arrival: "~25 million years (0.05c vessel)",
      image: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Kepler-452b_artist_concept.jpg/800px-Kepler-452b_artist_concept.jpg",
      comments: "Kepler-452b orbits a G-type star roughly 10% larger and 20% more luminous than the Sun, with an orbital period of 385 days — remarkably similar to Earth's year. At ~1.6 Earth radii it is classified as a super-Earth; surface gravity is estimated at 2× Earth's. The star is approximately 6 billion years old, 1.5 Gyr older than the Sun. If rocky and with an atmosphere, conditions for liquid surface water are plausible, though the host star's increased luminosity may be pushing the planet toward a runaway greenhouse state. Interstellar travel at current technology would require millions of years — it remains a benchmark candidate for remote spectroscopic biosignature searches."
    }
  };

  const select = document.getElementById('destinationSelect');
  const fields = {
    name:     document.getElementById('infoName'),
    distance: document.getElementById('infoDistance'),
    location: document.getElementById('infoLocation'),
    arrival:  document.getElementById('infoArrival')
  };
  const destImage   = document.getElementById('destImage');
  const imgPlaceholder = document.getElementById('imgPlaceholder');
  const comments    = document.getElementById('destComments');

  function pulse(el) {
    el.classList.remove('pulse');
    void el.offsetWidth; // reflow
    el.classList.add('pulse');
  }

  select.addEventListener('change', () => {
    const key = select.value;
    if (!key) {
      Object.values(fields).forEach(f => { f.textContent = '—'; f.classList.remove('populated'); });
      destImage.src = '';
      destImage.classList.remove('visible');
      imgPlaceholder.style.display = 'flex';
      comments.value = '';
      comments.placeholder = 'Select a destination to load mission notes…';
      comments.removeAttribute('style');
      return;
    }
    const d = destinations[key];

    // Fill info
    const map = { name: d.name, distance: d.distance, location: d.location, arrival: d.arrival };
    Object.entries(map).forEach(([k, v]) => {
      fields[k].textContent = v;
      fields[k].classList.add('populated');
      pulse(fields[k]);
    });

    // Image
    imgPlaceholder.style.display = 'none';
    destImage.classList.remove('visible');
    destImage.src = d.image;
    destImage.onload = () => destImage.classList.add('visible');
    destImage.onerror = () => { imgPlaceholder.style.display = 'flex'; };

    // Comments
    comments.removeAttribute('readonly');
    comments.value = d.comments;
    comments.style.color = 'var(--text)';
  });
</script>
</body>
</html>
